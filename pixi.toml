[workspace]
name = "m-explore-jazzy_ws"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
import = "mkdir -p turtle/src && vcs import --recursive --input turtle.repos turtle/src"
build = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF"
clean = "rm -rf build install log"

[dependencies]
# ROS 2 Jazzy
ros2-distro-mutex = ">=0.13,<0.14"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-xacro = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-ros-gz = ">=1.0.18,<2"
ros-jazzy-tf2-tools = ">=0.36.18,<0.37"
ros-dev-tools = ">=1.0.2,<2"
ros-jazzy-slam-toolbox = ">=2.8.3,<3"
ros-jazzy-ros2node = ">=0.32.7,<0.33"
ros-jazzy-ros2param = ">=0.32.7,<0.33"
ros-jazzy-ros2interface = ">=0.32.7,<0.33"
ros-jazzy-nav2-map-server = ">=1.3.10,<2"
ros-jazzy-ros2lifecycle = ">=0.32.7,<0.33"
ros-jazzy-nav2-amcl = ">=1.3.10,<2"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.10,<2"
ros-jazzy-image-geometry = ">=4.1.0,<5"
ros-jazzy-nav2-costmap-2d = ">=1.3.10,<2"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.4,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
ros-jazzy-cartographer = ">=2.0.0,<3"
ros-jazzy-cartographer-ros = ">=2.0.9003,<3"
ros-jazzy-gz-ros2-control = ">=1.2.17,<2"
ros-jazzy-navigation2 = ">=1.3.10,<2"
ros-jazzy-nav2-bringup = ">=1.3.10,<2"
setuptools = "<80"

[activation]
# Sources the colcon workspace (explore_lite, map_merge and the turtlebot3 packages from turtle/src)
scripts = ["install/setup.bash"]

[activation.env]
ROS_DISTRO = "jazzy"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"
ROS_DOMAIN_ID = "0"
